[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hwplotter-demo"
version = "1.2.0"
description = "OCR -> Hanzi stroke transfer -> personal handwriting style -> SVG/G-code demo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "opencv-python>=4.9",
  "scipy>=1.11",
  "scikit-image>=0.22",
  "Pillow>=10.0",
  "fonttools>=4.50",
  "typer>=0.12",
]

[project.optional-dependencies]
ocr = ["paddleocr>=3.0"]
ml = ["torch>=2.2"]
gui = []
rapidocr = ["rapidocr>=3", "onnxruntime>=1.18"]
legacy-gui = ["PySide6>=6.7"]
dev = ["pytest>=8", "ruff>=0.6", "mypy==1.15.0"]

[project.scripts]
hwplotter = "hwplotter.cli:app"
hwplotter-gui = "hwplotter.webui:main"
hwplotter-web = "hwplotter.webui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.package-data]
hwplotter = ["web/*.html"]

[tool.ruff.lint.flake8-bugbear]
# Typer Option constructs declarative CLI metadata, not mutable application defaults.
extend-immutable-calls = ["typer.Option"]
